name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readaloud-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: macos-15

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore Kokoro model cache
        id: kokoro-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Resources/Kokoro
            .cache/kokoro-downloads
          key: kokoro-assets-${{ hashFiles('scripts/kokoro-pins.sh', 'scripts/kokoro-checksums.sha256', 'scripts/download-kokoro-assets.sh') }}

      - name: Prepare Kokoro models
        run: bash scripts/bootstrap.sh

      - name: Save Kokoro model cache
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Resources/Kokoro
            .cache/kokoro-downloads
          key: kokoro-assets-${{ hashFiles('scripts/kokoro-pins.sh', 'scripts/kokoro-checksums.sha256', 'scripts/download-kokoro-assets.sh') }}

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          next="$(python3 - <<'PY'
          import re
          import subprocess

          versions = []
          tags = subprocess.check_output(
              ["git", "tag", "--list"],
              text=True,
          ).splitlines()

          for tag in tags:
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag.strip())
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if not versions:
              print("1.0.0")
          else:
              major, minor, patch = max(versions)
              print(f"{major}.{minor}.{patch + 1}")
          PY
          )"

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Next release: $next"

      - name: Archive unsigned iOS app
        shell: bash
        run: |
          IOS_DERIVED="$RUNNER_TEMP/ReadAloud-iOS"
          IOS_ARCHIVE="$RUNNER_TEMP/ReadAloud.xcarchive"
          SOURCE_PACKAGES="$RUNNER_TEMP/ReadAloud-SourcePackages"

          args=(
            -project ReadAloud.xcodeproj
            -scheme ReadAloud
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$IOS_DERIVED"
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
            -archivePath "$IOS_ARCHIVE"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            archive
          )
          xcodebuild "${args[@]}"

          test -d "$IOS_ARCHIVE"
          test -d "$IOS_ARCHIVE/Products/Applications/ReadAloud.app"

          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent             "$IOS_ARCHIVE"             "artifacts/ReadAloud-iOS-unsigned-${{ steps.version.outputs.version }}.xcarchive.zip"

          rm -rf "$IOS_DERIVED" "$IOS_ARCHIVE"

      - name: Build unsigned macOS app
        shell: bash
        run: |
          MAC_DERIVED="$RUNNER_TEMP/ReadAloud-macOS"
          SOURCE_PACKAGES="$RUNNER_TEMP/ReadAloud-SourcePackages"

          args=(
            -project ReadAloud.xcodeproj
            -scheme ReadAloudMac
            -configuration Release
            -sdk macosx
            -destination "platform=macOS"
            -derivedDataPath "$MAC_DERIVED"
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
            ARCHS=arm64
            ONLY_ACTIVE_ARCH=YES
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            build
          )
          xcodebuild "${args[@]}"

          MAC_APP="$MAC_DERIVED/Build/Products/Release/ReadAloud.app"
          test -d "$MAC_APP"

          ditto -c -k --sequesterRsrc --keepParent             "$MAC_APP"             "artifacts/ReadAloud-macOS-arm64-unsigned-${{ steps.version.outputs.version }}.zip"

          rm -rf "$MAC_DERIVED"

      - name: Verify release archives
        shell: bash
        run: |
          ls -lh artifacts

          for archive in artifacts/*.zip; do
            bytes="$(stat -f%z "$archive")"
            if (( bytes >= 2147483648 )); then
              echo "error: $archive is too large for a GitHub Release asset" >&2
              exit 1
            fi
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
        shell: bash
        run: |
          gh release create "$VERSION"             artifacts/*.zip             --target "$RELEASE_SHA"             --title "$VERSION"             --generate-notes
