name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readaloud-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: macos-15

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore Kokoro model cache
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: Resources/Kokoro
          key: kokoro-assets-${{ hashFiles('scripts/kokoro-pins.sh', 'scripts/kokoro-checksums.sha256', 'scripts/download-kokoro-assets.sh') }}

      - name: Prepare Kokoro models
        run: bash scripts/bootstrap.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          latest="$(
            git tag --list               | sed -E 's/^v//'               | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'               | sort -V               | tail -n 1               || true
          )"

          if [[ -z "$latest" ]]; then
            next="1.0.0"
          else
            IFS='.' read -r major minor patch <<< "$latest"
            next="${major}.${minor}.$((patch + 1))"
          fi

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Next release: $next"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          IOS_DERIVED="$RUNNER_TEMP/ReadAloud-iOS"
          SOURCE_PACKAGES="$RUNNER_TEMP/ReadAloud-SourcePackages"

          xcodebuild             -project ReadAloud.xcodeproj             -scheme ReadAloud             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$IOS_DERIVED"             -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

          IOS_APP="$IOS_DERIVED/Build/Products/Release-iphoneos/ReadAloud.app"
          test -d "$IOS_APP"

          mkdir -p artifacts
          ditto             -c -k --sequesterRsrc --keepParent             "$IOS_APP"             "artifacts/ReadAloud-iOS-unsigned-${{ steps.version.outputs.version }}.zip"

          rm -rf "$IOS_DERIVED"

      - name: Build unsigned macOS app
        shell: bash
        run: |
          MAC_DERIVED="$RUNNER_TEMP/ReadAloud-macOS"
          SOURCE_PACKAGES="$RUNNER_TEMP/ReadAloud-SourcePackages"

          xcodebuild             -project ReadAloud.xcodeproj             -scheme ReadAloudMac             -configuration Release             -sdk macosx             -destination 'platform=macOS'             -derivedDataPath "$MAC_DERIVED"             -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

          MAC_APP="$MAC_DERIVED/Build/Products/Release/ReadAloud.app"
          test -d "$MAC_APP"

          ditto             -c -k --sequesterRsrc --keepParent             "$MAC_APP"             "artifacts/ReadAloud-macOS-arm64-unsigned-${{ steps.version.outputs.version }}.zip"

          rm -rf "$MAC_DERIVED"

      - name: Verify release archives
        shell: bash
        run: |
          ls -lh artifacts

          for archive in artifacts/*.zip; do
            bytes="$(stat -f%z "$archive")"
            if (( bytes >= 2147483648 )); then
              echo "error: $archive is too large for a GitHub Release asset" >&2
              exit 1
            fi
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
        shell: bash
        run: |
          gh release create "$VERSION"             artifacts/*.zip             --target "$RELEASE_SHA"             --title "$VERSION"             --generate-notes
