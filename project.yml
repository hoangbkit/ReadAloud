name: ReadAloud

options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: J458WW3452
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configs:
  Debug: debug
  Release: release

packages:
  KokoroTTS:
    path: Vendor/kokoro-coreml/swift-tts

targets:
  ReadAloud:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ReadAloud
      - path: Resources/Kokoro
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Validate Kokoro Assets
        script: |
          bash "$SRCROOT/scripts/validate-kokoro-assets-for-build.sh"
        inputFiles:
          - $(SRCROOT)/Resources/Kokoro
          - $(SRCROOT)/scripts/validate-kokoro-assets-for-build.sh
          - $(SRCROOT)/scripts/kokoro-pins.sh
        basedOnDependencyAnalysis: false
    dependencies:
      - package: KokoroTTS
        product: KokoroTTS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.readaloud
        PRODUCT_NAME: ReadAloud
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ReadAloud
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO

schemes:
  ReadAloud:
    build:
      targets:
        ReadAloud: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
